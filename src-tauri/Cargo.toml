[package]
name = "fintasy-stock-royale"
version = "0.1.0"
description = "Fintasy: Stock Royale - 60-Player Battle Royale Trading Simulator"
authors = [
  "Tinatsei Chingaya <Zedfoura>",
  "Antigravity"
]
edition = "2021"

[lib]
name = "fintasy_lib"
crate-type = [
  "staticlib",
  "cdylib",
  "rlib"
]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = [ "derive" ] }
serde_json = "1.0"

[features]
default = []
steam = [ "dep:steamworks" ]

[dependencies.steamworks]
version = "0.11"
optional = true
